<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0D1117"/>
      <animate attributeName="x1" values="0;180;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;1020;1200" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="0" x2="950" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="21" stroke="#30363D"/>

  <circle cx="70" cy="58" r="6" fill="#FF5F56"/>
  <circle cx="92" cy="58" r="6" fill="#FFBD2E"/>
  <circle cx="114" cy="58" r="6" fill="#27C93F"/>

  <g opacity="0.35">
    <circle cx="1040" cy="48" r="3" fill="#22D3EE">
      <animate attributeName="opacity" values=".15;.8;.15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1070" cy="78" r="2.5" fill="#8B5CF6">
      <animate attributeName="opacity" values=".2;1;.2" dur="3s" begin=".4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="52" r="2" fill="#34D399">
      <animate attributeName="opacity" values=".1;.9;.1" dur="2.7s" begin=".8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="70" y="118" fill="#8B949E" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">$ whoami</text>

  <text x="70" y="165" fill="#F0F6FC" font-size="42" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Yusuf Can Ozan</text>
  <rect x="70" y="183" width="500" height="3" rx="1.5" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="width" values="180;500;180" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19">
    <text x="70" y="224" fill="#22D3EE">
      Web Developer
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.42;0.5;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="70" y="224" fill="#8B5CF6" opacity="0">
      Developer Tools · Local-first Apps
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="365" y="207" width="10" height="21" rx="2" fill="#C9D1D9">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>